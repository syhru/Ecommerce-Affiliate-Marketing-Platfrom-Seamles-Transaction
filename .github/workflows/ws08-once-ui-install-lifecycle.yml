name: WS-08 Once UI Ubuntu Install Lifecycle

'on':
  push:
    branches:
      - fix/header-navigation-profile-dropdown
    paths:
      - '.github/workflows/ws08-once-ui-install-lifecycle.yml'
      - '.github/ws08-once-ui-install/**'
      - 'frontend/**'

permissions:
  contents: read

jobs:
  ubuntu-install-lifecycle:
    name: Ubuntu Install Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Run Ubuntu install lifecycle verification
        run: node .github/ws08-once-ui-install/run-lifecycle.cjs

      - name: Upload install lifecycle evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ws08-ubuntu-install-lifecycle-evidence
          path: .github/ws08-once-ui-install/evidence
          if-no-files-found: error
